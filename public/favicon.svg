<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="card-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a24bff"/>
      <stop offset="1" stop-color="#2f7bff"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3cf0"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0a0a2e"/>

  <!-- Task card -->
  <rect x="10" y="14" width="36" height="30" rx="6" fill="#14143d" stroke="url(#card-stroke)" stroke-width="3"/>

  <!-- Checklist rows: checkbox plus line -->
  <rect x="15" y="19" width="6" height="6" rx="1.5" fill="#c03cff"/>
  <rect x="24" y="20.5" width="16" height="3" rx="1.5" fill="#c03cff"/>
  <rect x="15" y="27" width="6" height="6" rx="1.5" fill="#1fb8ff"/>
  <rect x="24" y="28.5" width="16" height="3" rx="1.5" fill="#1fb8ff"/>
  <rect x="15" y="35" width="6" height="6" rx="1.5" fill="#6bf03a"/>
  <rect x="24" y="36.5" width="10" height="3" rx="1.5" fill="#6bf03a"/>

  <!-- Large checkmark, with a dark outline so it separates from the card -->
  <polyline points="30,42 38,50 54,28" fill="none" stroke="#0a0a2e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="30,42 38,50 54,28" fill="none" stroke="url(#check)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparks -->
  <rect x="51" y="9" width="3" height="7" rx="1.5" fill="#ff3cf0" transform="rotate(30 52.5 12.5)"/>
  <rect x="56" y="17" width="3" height="6" rx="1.5" fill="#1fb8ff" transform="rotate(60 57.5 20)"/>
</svg>
